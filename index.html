<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Time Timer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f12;
    --surface: #1a1a20;
    --surface2: #22222c;
    --border: #2e2e3a;
    --text: #e8e8f0;
    /* FIX: was #7070888 (8 chars) */
    --text-muted: #707088;
    --accent: #ff4c4c;
    --accent-glow: rgba(255,76,76,0.25);
    --timer-bg: #1a1a20;
    --timer-ring: #ff4c4c;
    --timer-track: #2a2a36;
    --radius: 16px;
    --font: 'DM Sans', sans-serif;
    --mono: 'DM Mono', monospace;
    --elapsed-color: rgba(255,76,76,0.18);
    --remaining-color: #ff4c4c;
  }

  /* ── PRESETS ── */
  body.preset-minimal {
    --bg: #fafaf8; --surface: #ffffff; --surface2: #f0f0ec; --border: #e2e2dc;
    --text: #1a1a16; --accent: #222222; --accent-glow: rgba(0,0,0,0.08);
    --timer-bg: #f5f5f0; --timer-ring: #222222; --timer-track: #e8e8e0;
    --elapsed-color: rgba(0,0,0,0.06); --remaining-color: #222222;
  }
  body.preset-ocean {
    --bg: #081420; --surface: #0d2035; --surface2: #0f2840; --border: #1a3550;
    --text: #c8e8f8; --accent: #00bfff; --accent-glow: rgba(0,191,255,0.2);
    --timer-bg: #0d2035; --timer-ring: #00bfff; --timer-track: #142a40;
    --elapsed-color: rgba(0,191,255,0.12); --remaining-color: #00bfff;
  }
  body.preset-forest {
    --bg: #0a1410; --surface: #122018; --surface2: #162618; --border: #1e3424;
    --text: #c0dcc4; --accent: #4caf50; --accent-glow: rgba(76,175,80,0.2);
    --timer-bg: #122018; --timer-ring: #4caf50; --timer-track: #1a2e1e;
    --elapsed-color: rgba(76,175,80,0.12); --remaining-color: #4caf50;
  }
  body.preset-sunset {
    --bg: #1a0a00; --surface: #2a1208; --surface2: #321608; --border: #4a2010;
    --text: #f8d8b0; --accent: #ff8c00; --accent-glow: rgba(255,140,0,0.2);
    --timer-bg: #2a1208; --timer-ring: #ff8c00; --timer-track: #3a1808;
    --elapsed-color: rgba(255,140,0,0.12); --remaining-color: #ff8c00;
  }
  body.preset-aurora {
    --bg: #080a18; --surface: #0e1230; --surface2: #121638; --border: #1c2048;
    --text: #d8c8f8; --accent: #a855f7; --accent-glow: rgba(168,85,247,0.2);
    --timer-bg: #0e1230; --timer-ring: #a855f7; --timer-track: #181c40;
    --elapsed-color: rgba(168,85,247,0.12); --remaining-color: #a855f7;
  }
  body.preset-chalk {
    --bg: #2c2c2c; --surface: #3a3a3a; --surface2: #444444; --border: #555555;
    --text: #f0ede8; --accent: #f5e642; --accent-glow: rgba(245,230,66,0.15);
    --timer-bg: #3a3a3a; --timer-ring: #f5e642; --timer-track: #4a4a4a;
    --elapsed-color: rgba(245,230,66,0.1); --remaining-color: #f5e642;
  }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    transition: background 0.4s, color 0.4s;
    overflow-x: hidden;
  }

  /* ── LAYOUT ── */
  .app {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 280px 1fr;
    grid-template-rows: auto 1fr;
  }

  header {
    grid-column: 1 / -1;
    padding: 18px 28px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .logo {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.3px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--accent);
    display: inline-block;
  }

  .header-actions { display: flex; gap: 8px; align-items: center; }

  /* FIX: removed duplicate font-size declaration */
  .btn-icon {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    transition: background 0.15s, border-color 0.15s;
    display: flex; align-items: center; gap: 5px;
    font-family: var(--font);
  }
  .btn-icon:hover { background: var(--border); }

  /* ── SIDEBAR ── */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .section-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
  }

  /* Time Input */
  .time-input-group {
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 12px;
  }
  .time-input-group input {
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 500;
    width: 44px;
    text-align: center;
    -moz-appearance: textfield;
  }
  .time-input-group input::-webkit-outer-spin-button,
  .time-input-group input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .time-input-group .sep { font-size: 20px; font-weight: 300; opacity: 0.5; padding-bottom: 2px; }
  .time-label { font-size: 10px; color: var(--text); opacity: 0.5; text-align: center; margin-top: 4px; }
  .time-fields { display: flex; flex-direction: column; align-items: center; }

  /* Quick presets */
  .quick-btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .quick-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 12px;
    cursor: pointer;
    font-family: var(--font);
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .quick-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Design presets */
  .preset-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .preset-swatch {
    aspect-ratio: 1;
    border-radius: 10px;
    cursor: pointer;
    border: 2px solid transparent;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px;
    font-weight: 600;
    transition: transform 0.15s, border-color 0.15s;
    position: relative;
    overflow: hidden;
  }
  .preset-swatch:hover { transform: scale(1.05); }
  .preset-swatch.active { border-color: var(--accent); }
  .preset-swatch span {
    position: relative; z-index: 1;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    color: #fff;
  }

  /* Upload */
  .upload-area {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 18px 12px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s, opacity 0.2s;
    font-size: 12px;
    color: var(--text);
    opacity: 0.6;
    display: block;
  }
  .upload-area:hover { border-color: var(--accent); opacity: 1; }
  .upload-area input { display: none; }

  /* Controls */
  .controls { display: flex; gap: 8px; }
  .btn {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .btn:hover { background: var(--border); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  /* FIX: removed redundant background: var(--accent) from hover */
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-primary:disabled { filter: none; opacity: 0.5; }

  /* Settings toggles */
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    padding: 4px 0;
  }
  .toggle {
    width: 36px; height: 20px;
    background: var(--border);
    border-radius: 10px;
    position: relative;
    cursor: pointer;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .toggle::after {
    content: '';
    width: 14px; height: 14px;
    background: #fff;
    border-radius: 50%;
    position: absolute;
    top: 3px; left: 3px;
    transition: left 0.2s;
  }
  .toggle.on { background: var(--accent); }
  .toggle.on::after { left: 19px; }
  /* Small toggles (w:30 h:17) */
  .toggle[style*="width:30px"] { width: 30px !important; height: 17px !important; border-radius: 9px; }
  .toggle[style*="width:30px"]::after { width: 11px; height: 11px; top: 3px; left: 3px; }
  .toggle[style*="width:30px"].on::after { left: 16px; }

  /* Laps */
  .lap-list {
    max-height: 140px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .lap-item {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    font-family: var(--mono);
    padding: 4px 8px;
    background: var(--surface2);
    border-radius: 6px;
    opacity: 0.8;
  }

  /* ── MAIN AREA ── */
  .main {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px;
    gap: 24px;
    position: relative;
  }

  /* ── TIMER CANVAS ── */
  /* FIX: timer-wrap uses explicit size so overlay centers correctly */
  .timer-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: min(480px, 80vw);
    height: min(480px, 80vw);
  }

  #timerCanvas {
    width: 100%;
    height: 100%;
    cursor: pointer;
    border-radius: 50%;
    transition: filter 0.3s;
    display: block;
  }
  #timerCanvas.pulse {
    animation: canvasPulse 0.5s ease-out;
  }
  @keyframes canvasPulse {
    0% { filter: brightness(1.6); }
    100% { filter: brightness(1); }
  }

  /* FIX: overlay uses inset:0 on the wrap so it aligns perfectly */
  .timer-center-text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    user-select: none;
  }
  .timer-digital {
    font-family: var(--mono);
    font-size: clamp(26px, 5.5vw, 52px);
    font-weight: 500;
    color: var(--text);
    line-height: 1;
    letter-spacing: -1px;
  }
  .timer-label-text {
    font-size: 11px;
    color: var(--text);
    opacity: 0.4;
    margin-top: 6px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* Status bar */
  .status-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    color: var(--text);
    opacity: 0.6;
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--border);
    flex-shrink: 0;
    transition: background 0.3s;
  }
  .status-dot.running { background: var(--accent); animation: blink 1s ease-in-out infinite; }
  .status-dot.done { background: #4caf50; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* Progress bar (linear option) */
  .linear-bar-wrap {
    width: 100%;
    max-width: 480px;
  }
  .linear-bar {
    height: 6px;
    background: var(--timer-track);
    border-radius: 3px;
    overflow: hidden;
  }
  .linear-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 0.9s linear;
  }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 20px;
    font-size: 14px;
    font-weight: 500;
    z-index: 300;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    white-space: nowrap;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 200;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px;
    width: min(440px, 92vw);
    transform: scale(0.95);
    transition: transform 0.2s;
  }
  .modal-overlay.open .modal { transform: scale(1); }
  .modal h2 { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
  .modal-close {
    float: right; background: none; border: none; color: var(--text);
    font-size: 20px; cursor: pointer; opacity: 0.5; line-height: 1;
  }
  .modal-close:hover { opacity: 1; }

  /* Color picker */
  .color-row { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
  .color-row label { font-size: 13px; flex: 1; }
  .color-row input[type=color] {
    width: 38px; height: 28px; padding: 2px;
    border: 1px solid var(--border);
    border-radius: 6px; background: var(--surface2); cursor: pointer;
  }

  /* ── MOBILE ── */
  @media (max-width: 680px) {
    .app {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr auto;
    }
    header { padding: 14px 16px; }
    .sidebar {
      border-right: none;
      border-top: 1px solid var(--border);
      order: 3;
      padding: 16px;
      gap: 16px;
      overflow-y: visible;
    }
    .main { padding: 20px 16px; gap: 16px; }
    .preset-grid { grid-template-columns: repeat(4, 1fr); }
    /* FIX: timer-wrap uses vw-based size on mobile */
    .timer-wrap {
      width: min(320px, 82vw);
      height: min(320px, 82vw);
    }
    .timer-digital { font-size: clamp(22px, 8vw, 38px); }
    .section-label { margin-bottom: 8px; }
    .section-header { cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .section-header .chevron { transition: transform 0.2s; font-size: 12px; opacity: 0.5; }
    .section-header.collapsed .chevron { transform: rotate(-90deg); }
    .section-body { overflow: hidden; transition: max-height 0.3s ease; max-height: 600px; }
    .section-body.hidden { max-height: 0; }
  }

  /* ── FULLSCREEN MODE ── */
  body.fullscreen-mode .sidebar,
  body.fullscreen-mode header { display: none; }
  body.fullscreen-mode .app { grid-template-columns: 1fr; }
  body.fullscreen-mode .main { height: 100vh; }
  body.fullscreen-mode .timer-wrap {
    width: min(80vh, 80vw);
    height: min(80vh, 80vw);
  }

  .fullscreen-exit {
    display: none;
    position: fixed; top: 16px; right: 16px;
    z-index: 50;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-family: var(--font);
    font-size: 13px;
    color: var(--text);
  }
  body.fullscreen-mode .fullscreen-exit { display: block; }

  /* Hint text */
  .drag-hint {
    font-size: 11px;
    opacity: 0.3;
    text-align: center;
    letter-spacing: 0.5px;
  }

  /* Range slider */
  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
    margin-top: 6px;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* Finish flash overlay */
  .finish-overlay {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 10;
    opacity: 0;
  }
  .finish-overlay.flash { animation: flashAnim 0.7s ease-out forwards; }
  @keyframes flashAnim {
    0%   { background: var(--accent); opacity: 0.35; }
    100% { background: var(--accent); opacity: 0; }
  }
</style>
</head>
<body>
<div class="finish-overlay" id="finishOverlay"></div>

<button class="fullscreen-exit" onclick="toggleFullscreen()">✕ 나가기</button>

<div class="app">
  <!-- HEADER -->
  <header>
    <div class="logo">
      <span class="logo-dot"></span>
      Time Timer
    </div>
    <div class="header-actions">
      <button class="btn-icon" onclick="openCustomModal()">🎨 커스텀</button>
      <button class="btn-icon" onclick="toggleFullscreen()">⛶ 전체화면</button>
    </div>
  </header>

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <!-- Time Input -->
    <div class="sidebar-section">
      <div class="section-header" onclick="toggleSection(this)">
        <div class="section-label">시간 설정</div>
        <span class="chevron">▾</span>
      </div>
      <div class="section-body">
        <div class="time-input-group">
          <div class="time-fields">
            <input type="number" id="inputH" min="0" max="23" value="0" placeholder="00">
            <span class="time-label">시간</span>
          </div>
          <span class="sep">:</span>
          <div class="time-fields">
            <input type="number" id="inputM" min="0" max="59" value="25" placeholder="00">
            <span class="time-label">분</span>
          </div>
          <span class="sep">:</span>
          <div class="time-fields">
            <input type="number" id="inputS" min="0" max="59" value="0" placeholder="00">
            <span class="time-label">초</span>
          </div>
        </div>
        <div style="margin-top:10px">
          <div class="section-label" style="margin-bottom:6px">빠른 설정</div>
          <div class="quick-btns">
            <button class="quick-btn" onclick="setQuick(0,1,0)">1분</button>
            <button class="quick-btn" onclick="setQuick(0,5,0)">5분</button>
            <button class="quick-btn" onclick="setQuick(0,10,0)">10분</button>
            <button class="quick-btn" onclick="setQuick(0,15,0)">15분</button>
            <button class="quick-btn" onclick="setQuick(0,25,0)">25분</button>
            <button class="quick-btn" onclick="setQuick(0,30,0)">30분</button>
            <button class="quick-btn" onclick="setQuick(0,45,0)">45분</button>
            <button class="quick-btn" onclick="setQuick(1,0,0)">1시간</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="sidebar-section">
      <div class="section-label">컨트롤</div>
      <div class="controls" style="margin-bottom:8px">
        <button class="btn btn-primary" id="btnStart" onclick="startTimer()">▶ 시작</button>
        <button class="btn" id="btnPause" onclick="pauseTimer()" disabled>⏸ 일시정지</button>
      </div>
      <div class="controls">
        <button class="btn" onclick="resetTimer()">↺ 리셋</button>
        <button class="btn" id="btnAddMin" onclick="addMinute()">+1분</button>
      </div>
    </div>

    <!-- Design Presets -->
    <div class="sidebar-section">
      <div class="section-header" onclick="toggleSection(this)">
        <div class="section-label">디자인 프리셋</div>
        <span class="chevron">▾</span>
      </div>
      <div class="section-body">
        <div class="preset-grid">
          <div class="preset-swatch active" style="background:linear-gradient(135deg,#0f0f12,#ff4c4c)" onclick="applyPreset('default',this)" title="다크 레드">
            <span>Default</span>
          </div>
          <div class="preset-swatch" style="background:linear-gradient(135deg,#f5f5f0,#444)" onclick="applyPreset('minimal',this)" title="미니멀">
            <span>Minimal</span>
          </div>
          <div class="preset-swatch" style="background:linear-gradient(135deg,#081420,#00bfff)" onclick="applyPreset('ocean',this)" title="오션">
            <span>Ocean</span>
          </div>
          <div class="preset-swatch" style="background:linear-gradient(135deg,#0a1410,#4caf50)" onclick="applyPreset('forest',this)" title="포레스트">
            <span>Forest</span>
          </div>

<!-- TOAST -->
<div class="toast" id="toast"></div>
<div class="finish-overlay" id="finishOverlay2" style="display:none"></div>

<script>
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// STATE
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
let totalSeconds = 25 * 60;
let remainingSeconds = totalSeconds;
let isRunning = false;
let intervalId = null;
let bgImage = null;
let currentPreset = 'default';
// FIX: track whether timer has been started at least once (for pause/resume)
let timerStarted = false;

const opts = {
  sound: true,
  digital: true,
  linear: false,
  elapsed: false,
  repeat: false,
  ticks: true,
  glow: true,
  volume: 0.7
};

let customColors = {
  bg: '#0f0f12', surface: '#1a1a20', accent: '#ff4c4c', track: '#2a2a36', text: '#e8e8f0'
};

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// CANVAS DRAWING
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const canvas = document.getElementById('timerCanvas');
const ctx = canvas.getContext('2d');

function getVar(name) {
  return getComputedStyle(document.body).getPropertyValue(name).trim();
}

function drawTimer() {
  const W = canvas.width, H = canvas.height;
  const cx = W / 2, cy = H / 2;
  const R = W * 0.42;
  const lineW = W * 0.072;

  ctx.clearRect(0, 0, W, H);

  // ── Background ──
  if (bgImage) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, R + lineW / 2 + 4, 0, Math.PI * 2);
    ctx.clip();
    const iAsp = bgImage.width / bgImage.height;
    const diam = (R + lineW / 2 + 4) * 2;
    let sw, sh;
    if (iAsp > 1) { sh = diam; sw = sh * iAsp; }
    else { sw = diam; sh = sw / iAsp; }
    ctx.drawImage(bgImage, cx - sw / 2, cy - sh / 2, sw, sh);
    ctx.restore();
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, R + lineW / 2 + 4, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fill();
    ctx.restore();
  } else {
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, R + lineW / 2 + 4, 0, Math.PI * 2);
    ctx.fillStyle = getVar('--timer-bg');
    ctx.fill();
    ctx.restore();
  }

  const frac = totalSeconds > 0 ? remainingSeconds / totalSeconds : 0;
  const startAngle = -Math.PI / 2;

  // ── Track ring ──
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.strokeStyle = getVar('--timer-track');
  ctx.lineWidth = lineW;
  ctx.lineCap = 'butt';
  ctx.stroke();

  // ── Elapsed slice ──
  const elapsedFrac = 1 - frac;
  if (elapsedFrac > 0.002) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R + lineW / 2, startAngle, startAngle + elapsedFrac * Math.PI * 2);
    ctx.closePath();
    ctx.fillStyle = getVar('--elapsed-color');
    ctx.fill();
    ctx.restore();
  }

  // ── Remaining arc ──
  // FIX: ctx.save/restore always paired, glow handled inside save block
  if (frac > 0.002) {
    const endAngle = startAngle + frac * Math.PI * 2;

    ctx.save();
    if (opts.glow) {
      ctx.shadowColor = getVar('--accent');
      ctx.shadowBlur = 20;
    }
    ctx.beginPath();
    ctx.arc(cx, cy, R, startAngle, endAngle);
    ctx.strokeStyle = getVar('--remaining-color');
    ctx.lineWidth = lineW;
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.restore();

    // Sweep-end tip dot
    const tipX = cx + R * Math.cos(endAngle);
    const tipY = cy + R * Math.sin(endAngle);
    ctx.save();
    if (opts.glow) {
      ctx.shadowColor = getVar('--accent');
      ctx.shadowBlur = 28;
    }
    ctx.beginPath();
    ctx.arc(tipX, tipY, lineW / 2 + 2, 0, Math.PI * 2);
    ctx.fillStyle = getVar('--remaining-color');
    ctx.fill();
    ctx.restore();
  }

  // ── Tick marks ──
  if (opts.ticks) {
    for (let i = 0; i < 60; i++) {
      const a = (i / 60) * Math.PI * 2 - Math.PI / 2;
      const isMajor = i % 5 === 0;
      const outer = R + lineW / 2 + (isMajor ? 7 : 4);
      const inner = R + lineW / 2 + 2;
      ctx.beginPath();
      ctx.moveTo(cx + outer * Math.cos(a), cy + outer * Math.sin(a));
      ctx.lineTo(cx + inner * Math.cos(a), cy + inner * Math.sin(a));
      ctx.strokeStyle = isMajor ? getVar('--text') : getVar('--timer-track');
      ctx.lineWidth = isMajor ? 2.5 : 1.2;
      ctx.globalAlpha = isMajor ? 0.55 : 0.3;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // Minute labels
    ctx.font = `${W * 0.026}px DM Sans, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = getVar('--text');
    ctx.globalAlpha = 0.35;
    [5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55, 60].forEach(min => {
      const a = (min / 60) * Math.PI * 2 - Math.PI / 2;
      const lr = R + lineW / 2 + 18;
      ctx.fillText(String(min), cx + lr * Math.cos(a), cy + lr * Math.sin(a));
    });
    ctx.globalAlpha = 1;
  }

  // ── Center hole ──
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, R - lineW / 2 - 2, 0, Math.PI * 2);
  ctx.fillStyle = bgImage ? 'rgba(0,0,0,0)' : getVar('--timer-bg');
  ctx.fill();
  ctx.restore();

  // ── Outer border ring ──
  ctx.beginPath();
  ctx.arc(cx, cy, R + lineW / 2 + 4, 0, Math.PI * 2);
  ctx.strokeStyle = getVar('--border');
  ctx.lineWidth = 2;
  ctx.lineCap = 'butt';
  ctx.stroke();

  updateDisplayText();
}

function updateDisplayText() {
  const disp = opts.elapsed ? (totalSeconds - remainingSeconds) : remainingSeconds;
  const h = Math.floor(disp / 3600);
  const m = Math.floor((disp % 3600) / 60);
  const s = disp % 60;
  const str = h > 0
    ? `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
    : `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;

  document.getElementById('digitalDisplay').textContent = str;
  document.getElementById('digitalDisplay').style.display = opts.digital ? '' : 'none';
  document.getElementById('timerStatus').style.display = opts.digital ? '' : 'none';

  const frac = totalSeconds > 0 ? remainingSeconds / totalSeconds : 0;
  document.getElementById('linearFill').style.width = (frac * 100) + '%';
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// TIMER LOGIC
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function getInputSeconds() {
  const h = parseInt(document.getElementById('inputH').value) || 0;
  const m = parseInt(document.getElementById('inputM').value) || 0;
  const s = parseInt(document.getElementById('inputS').value) || 0;
  return h * 3600 + m * 60 + s;
}

function startTimer() {
  if (isRunning) return;

  // FIX: only reset remaining if timer hasn't started yet OR already finished
  if (!timerStarted || remainingSeconds === 0) {
    totalSeconds = getInputSeconds();
    if (totalSeconds === 0) { showToast('시간을 설정해주세요'); return; }
    remainingSeconds = totalSeconds;
  }

  timerStarted = true;
  isRunning = true;
  document.getElementById('btnStart').disabled = true;
  document.getElementById('btnPause').disabled = false;
  document.getElementById('statusDot').className = 'status-dot running';
  document.getElementById('statusText').textContent = '실행 중...';
  document.getElementById('timerStatus').textContent = '실행 중';
  intervalId = setInterval(tick, 1000);
  drawTimer();
}

function tick() {
  if (remainingSeconds > 0) {
    remainingSeconds--;
    drawTimer();
    if (remainingSeconds === 0) finish();
  }
}

function pauseTimer() {
  if (!isRunning) return;
  isRunning = false;
  clearInterval(intervalId);
  intervalId = null;
  document.getElementById('btnStart').disabled = false;
  document.getElementById('btnPause').disabled = true;
  document.getElementById('statusDot').className = 'status-dot';
  document.getElementById('statusText').textContent = '일시정지됨';
  document.getElementById('timerStatus').textContent = '일시정지';
}

function resetTimer() {
  pauseTimer();
  timerStarted = false;
  totalSeconds = getInputSeconds() || 25 * 60;
  remainingSeconds = totalSeconds;
  document.getElementById('btnStart').disabled = false;
  document.getElementById('statusDot').className = 'status-dot';
  document.getElementById('statusText').textContent = '시작 버튼을 누르거나 타이머를 클릭하세요';
  document.getElementById('timerStatus').textContent = '준비';
  drawTimer();
}

function finish() {
  isRunning = false;
  timerStarted = false;
  clearInterval(intervalId);
  intervalId = null;
  document.getElementById('btnStart').disabled = false;
  document.getElementById('btnPause').disabled = true;
  document.getElementById('statusDot').className = 'status-dot done';
  document.getElementById('statusText').textContent = '타이머 완료! 🎉';
  document.getElementById('timerStatus').textContent = '완료!';

  // Flash overlay
  const ov = document.getElementById('finishOverlay');
  ov.classList.remove('flash');
  void ov.offsetWidth; // reflow to restart animation
  ov.classList.add('flash');

  // Canvas pulse
  canvas.classList.remove('pulse');
  void canvas.offsetWidth;
  canvas.classList.add('pulse');
  setTimeout(() => canvas.classList.remove('pulse'), 600);

  if (opts.sound) playAlarm();
  showToast('⏰ 타이머 완료!');

  if (opts.repeat) {
    setTimeout(() => {
      remainingSeconds = totalSeconds;
      startTimer();
    }, 1500);
  }
}

// FIX: canvas click toggles start/pause cleanly
function handleCanvasClick() {
  if (isRunning) pauseTimer();
  else startTimer();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// QUICK SET
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function setQuick(h, m, s) {
  if (isRunning) pauseTimer();
  timerStarted = false;
  document.getElementById('inputH').value = h;
  document.getElementById('inputM').value = m;
  document.getElementById('inputS').value = s;
  totalSeconds = h * 3600 + m * 60 + s;
  remainingSeconds = totalSeconds;
  document.getElementById('statusDot').className = 'status-dot';
  document.getElementById('statusText').textContent = '시작 버튼을 누르거나 타이머를 클릭하세요';
  document.getElementById('timerStatus').textContent = '준비';
  document.getElementById('btnStart').disabled = false;
  drawTimer();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// ADD MINUTE
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function addMinute() {
  remainingSeconds += 60;
  totalSeconds += 60;
  drawTimer();
  showToast('+1분 추가되었습니다');
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// ALARM SOUND
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
let currentAlarmPreset = 'chime';
let customAlarmBuffer = null;   // AudioBuffer for custom sound
let customAlarmUrl = null;      // ObjectURL for custom audio

function selectAlarmPreset(name, el) {
  currentAlarmPreset = name;
  document.querySelectorAll('.alarm-preset-btn').forEach(b => b.classList.remove('active'));
  if (el) el.classList.add('active');
}

function handleCustomAlarm(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (customAlarmUrl) URL.revokeObjectURL(customAlarmUrl);
  customAlarmUrl = URL.createObjectURL(file);
  currentAlarmPreset = 'custom';
  document.querySelectorAll('.alarm-preset-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('customAlarmBtn');
  btn.style.display = '';
  btn.classList.add('active');
  document.getElementById('customAlarmName').textContent = '🎼 ' + file.name;
  document.getElementById('customAlarmName').style.display = 'block';
  showToast('커스텀 알림음이 등록되었습니다');
}

function previewAlarm() {
  playAlarm();
}

function playAlarm() {
  if (!opts.sound) return;
  if (currentAlarmPreset === 'custom' && customAlarmUrl) {
    const audio = new Audio(customAlarmUrl);
    audio.volume = opts.volume;
    audio.play().catch(() => {});
    return;
  }
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const masterGain = ac.createGain();
    masterGain.gain.value = opts.volume;
    masterGain.connect(ac.destination);

    const presets = {
      chime: () => {
        // Warm ascending chime C-E-G-C
        [523, 659, 784, 1047].forEach((freq, i) => {
          const osc = ac.createOscillator(); const g = ac.createGain();
          osc.type = 'sine'; osc.frequency.value = freq;
          const t = ac.currentTime + i * 0.22;
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime(0.4, t + 0.04);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
          osc.connect(g); g.connect(masterGain);
          osc.start(t); osc.stop(t + 0.8);
        });
      },
      bell: () => {
        // Single resonant bell with overtones
        [[440, 1], [880, 0.5], [1320, 0.25], [1760, 0.12]].forEach(([freq, amp]) => {
          const osc = ac.createOscillator(); const g = ac.createGain();
          osc.type = 'sine'; osc.frequency.value = freq;
          const t = ac.currentTime;
          g.gain.setValueAtTime(amp * 0.6, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 2.5);
          osc.connect(g); g.connect(masterGain);
          osc.start(t); osc.stop(t + 2.6);
        });
        // repeat
        [[440, 1]].forEach(([freq, amp]) => {
          const osc = ac.createOscillator(); const g = ac.createGain();
          osc.type = 'sine'; osc.frequency.value = freq;
          const t = ac.currentTime + 1.0;
          g.gain.setValueAtTime(amp * 0.4, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 1.5);
          osc.connect(g); g.connect(masterGain);
          osc.start(t); osc.stop(t + 1.6);
        });
      },
      beep: () => {
        // Short digital beeps
        [0, 0.18, 0.36, 0.54].forEach(delay => {
          const osc = ac.createOscillator(); const g = ac.createGain();
          osc.type = 'square'; osc.frequency.value = 880;
          const t = ac.currentTime + delay;
          g.gain.setValueAtTime(0.2, t);
          g.gain.setValueAtTime(0, t + 0.12);
          osc.connect(g); g.connect(masterGain);
          osc.start(t); osc.stop(t + 0.13);
        });
      },
      soft: () => {
        // Gentle sine wave swell
        const osc = ac.createOscillator(); const g = ac.createGain();
        osc.type = 'sine'; osc.frequency.value = 528;
        g.gain.setValueAtTime(0, ac.currentTime);
        g.gain.linearRampToValueAtTime(0.5, ac.currentTime + 0.3);
        g.gain.linearRampToValueAtTime(0.3, ac.currentTime + 0.8);
        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 2.0);
        osc.connect(g); g.connect(masterGain);
        // Add slight chorus
        const osc2 = ac.createOscillator(); const g2 = ac.createGain();
        osc2.type = 'sine'; osc2.frequency.value = 531;
        g2.gain.setValueAtTime(0, ac.currentTime);
        g2.gain.linearRampToValueAtTime(0.2, ac.currentTime + 0.3);
        g2.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 2.0);
        osc2.connect(g2); g2.connect(masterGain);
        osc.start(); osc.stop(ac.currentTime + 2.1);
        osc2.start(); osc2.stop(ac.currentTime + 2.1);
      },
      alert: () => {
        // Urgent descending two-tone alert
        [[880, 660], [880, 660]].forEach(([f1, f2], rep) => {
          const t0 = ac.currentTime + rep * 0.5;
          [f1, f2].forEach((freq, i) => {
            const osc = ac.createOscillator(); const g = ac.createGain();
            osc.type = 'sawtooth'; osc.frequency.value = freq;
            const t = t0 + i * 0.18;
            g.gain.setValueAtTime(0.25, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.17);
            osc.connect(g); g.connect(masterGain);
            osc.start(t); osc.stop(t + 0.18);
          });
        });
      }
    };

    (presets[currentAlarmPreset] || presets.chime)();
  } catch (e) { /* silently fail */ }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// YOUTUBE
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
let ytLoop = false;
let ytShuffle = false;
let ytCurrentId = null;
let ytCurrentListId = null;

function toggleYtLoop(el) {
  ytLoop = !ytLoop;
  el.classList.toggle('on', ytLoop);
}
function toggleYtShuffle(el) {
  ytShuffle = !ytShuffle;
  el.classList.toggle('on', ytShuffle);
}

function extractYtInfo(url) {
  url = url.trim();
  // Extract playlist ID
  const plMatch = url.match(/[?&]list=([A-Za-z0-9_-]+)/);
  const listId = plMatch ? plMatch[1] : null;
  // Extract video ID
  const vidPatterns = [
    /youtu\.be\/([A-Za-z0-9_-]{11})/,
    /[?&]v=([A-Za-z0-9_-]{11})/,
    /\/embed\/([A-Za-z0-9_-]{11})/,
    /\/shorts\/([A-Za-z0-9_-]{11})/,
    /\/v\/([A-Za-z0-9_-]{11})/,
  ];
  let videoId = null;
  for (const p of vidPatterns) {
    const m = url.match(p); if (m) { videoId = m[1]; break; }
  }
  return { videoId, listId };
}

function buildYtEmbedUrl(videoId, listId) {
  let src = 'https://www.youtube.com/embed/';
  const params = new URLSearchParams();
  params.set('autoplay', '1');
  params.set('controls', '1');
  if (ytLoop) params.set('loop', '1');
  if (ytShuffle) params.set('shuffle', '1');

  if (listId) {
    // Playlist mode
    src += (videoId || 'videoseries');
    params.set('list', listId);
    if (ytLoop) params.set('loop', '1');
  } else if (videoId) {
    src += videoId;
    if (ytLoop) params.set('playlist', videoId); // loop single video trick
  } else {
    return null;
  }
  return src + '?' + params.toString();
}

function loadYoutube() {
  const input = document.getElementById('ytUrlInput');
  const errEl = document.getElementById('ytError');
  const embedEl = document.getElementById('ytEmbed');
  const frame = document.getElementById('ytFrame');
  const controls = document.getElementById('ytControls');

  errEl.style.display = 'none';
  const { videoId, listId } = extractYtInfo(input.value);
  if (!videoId && !listId) {
    errEl.textContent = '유효한 유튜브 URL 또는 재생목록 URL을 입력해주세요';
    errEl.style.display = 'block';
    input.style.borderColor = '#ff6b6b';
    return;
  }

  ytCurrentId = videoId;
  ytCurrentListId = listId;

  const embedUrl = buildYtEmbedUrl(videoId, listId);
  if (!embedUrl) { errEl.textContent = '임베드 URL 생성 실패'; errEl.style.display = 'block'; return; }

  frame.src = embedUrl;
  embedEl.style.display = 'block';
  controls.style.display = 'flex';
  showToast(listId ? '재생목록을 재생합니다' : '유튜브 음악을 재생합니다');
}

function stopYoutube() {
  const frame = document.getElementById('ytFrame');
  const embedEl = document.getElementById('ytEmbed');
  const controls = document.getElementById('ytControls');
  frame.src = '';
  embedEl.style.display = 'none';
  controls.style.display = 'none';
  showToast('재생이 중지되었습니다');
}

function applyYtVolume(val) {
  document.getElementById('ytVolVal').textContent = val + '%';
  // Reload with new params preserving current track
  const frame = document.getElementById('ytFrame');
  if (!frame.src || !ytCurrentId && !ytCurrentListId) return;
  const embedUrl = buildYtEmbedUrl(ytCurrentId, ytCurrentListId);
  if (embedUrl) frame.src = embedUrl;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// PRESETS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function applyPreset(name, el) {
  currentPreset = name;
  document.body.className = document.body.className
    .split(' ').filter(c => !c.startsWith('preset-')).join(' ').trim();
  if (name !== 'default') {
    document.body.classList.add('preset-' + name);
  }
  document.querySelectorAll('.preset-swatch').forEach(s => s.classList.remove('active'));
  if (el) el.classList.add('active');
  if (name !== 'custom') {
    document.getElementById('customStyle')?.remove();
  }
  // Delay one frame so CSS vars are recalculated before drawing
  requestAnimationFrame(() => drawTimer());
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// CUSTOM COLORS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function openCustomModal() {
  document.getElementById('customModal').classList.add('open');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

function applyCustomColor() {
  customColors.bg      = document.getElementById('cc-bg').value;
  customColors.surface = document.getElementById('cc-surface').value;
  customColors.accent  = document.getElementById('cc-accent').value;
  customColors.track   = document.getElementById('cc-track').value;
  customColors.text    = document.getElementById('cc-text').value;
}

function saveCustom() {
  let styleEl = document.getElementById('customStyle');
  if (!styleEl) {
    styleEl = document.createElement('style');
    styleEl.id = 'customStyle';
    document.head.appendChild(styleEl);
  }
  const c = customColors;
  styleEl.textContent = `
    body.preset-custom {
      --bg: ${c.bg};
      --surface: ${c.surface};
      --surface2: ${adjustColor(c.surface, -10)};
      --border: ${adjustColor(c.surface, 22)};
      --text: ${c.text};
      --accent: ${c.accent};
      --accent-glow: ${hexToRgba(c.accent, 0.2)};
      --timer-bg: ${c.surface};
      --timer-ring: ${c.accent};
      --timer-track: ${adjustColor(c.surface, 16)};
      --elapsed-color: ${hexToRgba(c.accent, 0.12)};
      --remaining-color: ${c.accent};
    }
  `;
  applyPreset('custom', document.getElementById('customSwatch'));
  closeModal('customModal');
  showToast('커스텀 색상이 적용되었습니다');
}

function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${a})`;
}

function adjustColor(hex, amount) {
  let r = parseInt(hex.slice(1, 3), 16);
  let g = parseInt(hex.slice(3, 5), 16);
  let b = parseInt(hex.slice(5, 7), 16);
  r = Math.min(255, Math.max(0, r + amount));
  g = Math.min(255, Math.max(0, g + amount));
  b = Math.min(255, Math.max(0, b + amount));
  return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// IMAGE UPLOAD
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const uploadArea = document.getElementById('uploadArea');
uploadArea.addEventListener('dragover', e => {
  e.preventDefault();
  uploadArea.style.borderColor = 'var(--accent)';
  uploadArea.style.opacity = '1';
});
uploadArea.addEventListener('dragleave', () => {
  uploadArea.style.borderColor = '';
  uploadArea.style.opacity = '';
});
uploadArea.addEventListener('drop', e => {
  e.preventDefault();
  uploadArea.style.borderColor = '';
  uploadArea.style.opacity = '';
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) loadBgImage(file);
});

function handleImageUpload(e) {
  const file = e.target.files[0];
  if (file) loadBgImage(file);
}

function loadBgImage(file) {
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      bgImage = img;
      drawTimer();
      showToast('배경 이미지가 적용되었습니다');
      uploadArea.style.backgroundImage = `url(${ev.target.result})`;
      uploadArea.style.backgroundSize = 'cover';
      uploadArea.style.backgroundPosition = 'center';
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function clearBgImage() {
  bgImage = null;
  document.getElementById('bgUpload').value = '';
  uploadArea.style.backgroundImage = '';
  uploadArea.style.backgroundSize = '';
  uploadArea.style.backgroundPosition = '';
  drawTimer();
  showToast('배경 이미지가 제거되었습니다');
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// TOGGLES
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function toggleOpt(key) {
  opts[key] = !opts[key];
  const elId = 'toggle' + key.charAt(0).toUpperCase() + key.slice(1);
  const el = document.getElementById(elId);
  if (el) el.classList.toggle('on', opts[key]);
  if (key === 'linear') {
    document.getElementById('linearBarWrap').style.display = opts.linear ? '' : 'none';
  }
  drawTimer();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// TOAST
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
let toastTimerId;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimerId);
  toastTimerId = setTimeout(() => t.classList.remove('show'), 2800);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// FULLSCREEN
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function toggleFullscreen() {
  document.body.classList.toggle('fullscreen-mode');
  // Give layout time to reflow before redrawing
  requestAnimationFrame(() => drawTimer());
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// MOBILE COLLAPSIBLE SECTIONS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function toggleSection(headerEl) {
  if (window.innerWidth > 680) return;
  headerEl.classList.toggle('collapsed');
  const body = headerEl.nextElementSibling;
  if (body && body.classList.contains('section-body')) {
    body.classList.toggle('hidden');
  }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// KEYBOARD SHORTCUTS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  switch (e.code) {
    case 'Space': e.preventDefault(); isRunning ? pauseTimer() : startTimer(); break;
    case 'KeyR': resetTimer(); break;
    case 'KeyL': addMinute(); break;
    case 'KeyF': toggleFullscreen(); break;
    case 'KeyM': toggleOpt('sound'); break;
  }
});

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// INPUT LIVE UPDATE
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
['inputH', 'inputM', 'inputS'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => {
    if (!isRunning && !timerStarted) {
      totalSeconds = getInputSeconds();
      remainingSeconds = totalSeconds;
      drawTimer();
    }
  });
});

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// WINDOW RESIZE
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
window.addEventListener('resize', () => {
  drawTimer();
});

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// INIT
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
setTimeout(() => {
  drawTimer();
  if (window.innerWidth > 680) {
    document.getElementById('dragHint').textContent =
      '스페이스: 시작/정지 · R: 리셋 · L: +1분 · F: 전체화면 · M: 음소거';
  }
}, 80);

// Animation loop — only redraws while running (for glow animation)
function animLoop() {
  if (isRunning) drawTimer();
  requestAnimationFrame(animLoop);
}
animLoop();

// Modal backdrop click to close
document.getElementById('customModal').addEventListener('click', function (e) {
  if (e.target === this) closeModal('customModal');
});
</script>
