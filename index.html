<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Time Timer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f12;
    --surface: #1a1a20;
    --surface2: #22222c;
    --border: #2e2e3a;
    --text: #e8e8f0;
    --text-muted: #7070888;
    --accent: #ff4c4c;
    --accent-glow: rgba(255,76,76,0.25);
    --timer-bg: #1a1a20;
    --timer-ring: #ff4c4c;
    --timer-track: #2a2a36;
    --radius: 16px;
    --font: 'DM Sans', sans-serif;
    --mono: 'DM Mono', monospace;
    --elapsed-color: rgba(255,76,76,0.18);
    --remaining-color: #ff4c4c;
  }

  /* ── PRESETS ── */
  body.preset-minimal {
    --bg: #fafaf8; --surface: #ffffff; --surface2: #f0f0ec; --border: #e2e2dc;
    --text: #1a1a16; --accent: #222; --accent-glow: rgba(0,0,0,0.08);
    --timer-bg: #f5f5f0; --timer-ring: #222; --timer-track: #e8e8e0;
    --elapsed-color: rgba(0,0,0,0.06); --remaining-color: #222;
  }
  body.preset-ocean {
    --bg: #081420; --surface: #0d2035; --surface2: #0f2840; --border: #1a3550;
    --text: #c8e8f8; --accent: #00bfff; --accent-glow: rgba(0,191,255,0.2);
    --timer-bg: #0d2035; --timer-ring: #00bfff; --timer-track: #142a40;
    --elapsed-color: rgba(0,191,255,0.12); --remaining-color: #00bfff;
  }
  body.preset-forest {
    --bg: #0a1410; --surface: #122018; --surface2: #162618; --border: #1e3424;
    --text: #c0dcc4; --accent: #4caf50; --accent-glow: rgba(76,175,80,0.2);
    --timer-bg: #122018; --timer-ring: #4caf50; --timer-track: #1a2e1e;
    --elapsed-color: rgba(76,175,80,0.12); --remaining-color: #4caf50;
  }
  body.preset-sunset {
    --bg: #1a0a00; --surface: #2a1208; --surface2: #321608; --border: #4a2010;
    --text: #f8d8b0; --accent: #ff8c00; --accent-glow: rgba(255,140,0,0.2);
    --timer-bg: #2a1208; --timer-ring: #ff8c00; --timer-track: #3a1808;
    --elapsed-color: rgba(255,140,0,0.12); --remaining-color: #ff8c00;
  }
  body.preset-aurora {
    --bg: #080a18; --surface: #0e1230; --surface2: #121638; --border: #1c2048;
    --text: #d8c8f8; --accent: #a855f7; --accent-glow: rgba(168,85,247,0.2);
    --timer-bg: #0e1230; --timer-ring: #a855f7; --timer-track: #181c40;
    --elapsed-color: rgba(168,85,247,0.12); --remaining-color: #a855f7;
  }
  body.preset-chalk {
    --bg: #2c2c2c; --surface: #3a3a3a; --surface2: #444; --border: #555;
    --text: #f0ede8; --accent: #f5e642; --accent-glow: rgba(245,230,66,0.15);
    --timer-bg: #3a3a3a; --timer-ring: #f5e642; --timer-track: #4a4a4a;
    --elapsed-color: rgba(245,230,66,0.1); --remaining-color: #f5e642;
  }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    transition: background 0.4s, color 0.4s;
    overflow-x: hidden;
  }

  /* ── LAYOUT ── */
  .app {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 280px 1fr;
    grid-template-rows: auto 1fr;
  }

  header {
    grid-column: 1 / -1;
    padding: 18px 28px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .logo {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.3px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); display: inline-block; }

  .header-actions { display: flex; gap: 8px; align-items: center; }

  .btn-icon {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    transition: background 0.15s, border-color 0.15s;
    display: flex; align-items: center; gap: 5px;
    font-family: var(--font);
    font-size: 13px;
  }
  .btn-icon:hover { background: var(--border); }

  /* ── SIDEBAR ── */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .section-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
  }

  /* Time Input */
  .time-input-group {
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 12px;
  }
  .time-input-group input {
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 500;
    width: 44px;
    text-align: center;
    -moz-appearance: textfield;
  }
  .time-input-group input::-webkit-outer-spin-button,
  .time-input-group input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .time-input-group .sep { font-size: 20px; font-weight: 300; opacity: 0.5; padding-bottom: 2px; }
  .time-label { font-size: 10px; color: var(--text); opacity: 0.5; text-align: center; margin-top: 4px; }
  .time-fields { display: flex; flex-direction: column; align-items: center; }

  /* Quick presets */
  .quick-btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .quick-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 12px;
    cursor: pointer;
    font-family: var(--font);
    transition: background 0.15s, border-color 0.15s;
  }
  .quick-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Design presets */
  .preset-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .preset-swatch {
    aspect-ratio: 1;
    border-radius: 10px;
    cursor: pointer;
    border: 2px solid transparent;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px;
    font-weight: 600;
    transition: transform 0.15s, border-color 0.15s;
    position: relative;
    overflow: hidden;
  }
  .preset-swatch:hover { transform: scale(1.05); }
  .preset-swatch.active { border-color: var(--accent); }
  .preset-swatch span { position: relative; z-index: 1; text-shadow: 0 1px 3px rgba(0,0,0,0.5); color: #fff; }

  /* Upload */
  .upload-area {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 18px 12px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    font-size: 12px;
    color: var(--text);
    opacity: 0.6;
  }
  .upload-area:hover { border-color: var(--accent); opacity: 1; }
  .upload-area input { display: none; }

  /* Controls */
  .controls { display: flex; gap: 8px; }
  .btn {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .btn:hover { background: var(--border); }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .btn-primary:hover { filter: brightness(1.1); background: var(--accent); }

  /* Settings toggles */
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    padding: 4px 0;
  }
  .toggle {
    width: 36px; height: 20px;
    background: var(--border);
    border-radius: 10px;
    position: relative;
    cursor: pointer;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .toggle::after {
    content: '';
    width: 14px; height: 14px;
    background: #fff;
    border-radius: 50%;
    position: absolute;
    top: 3px; left: 3px;
    transition: left 0.2s;
  }
  .toggle.on { background: var(--accent); }
  .toggle.on::after { left: 19px; }

  /* Laps */
  .lap-list {
    max-height: 140px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .lap-item {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    font-family: var(--mono);
    padding: 4px 8px;
    background: var(--surface2);
    border-radius: 6px;
    opacity: 0.8;
  }

  /* ── MAIN AREA ── */
  .main {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px;
    gap: 24px;
    position: relative;
  }

  /* ── TIMER CANVAS ── */
  .timer-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #timerCanvas {
    max-width: min(480px, 80vw);
    max-height: min(480px, 80vw);
    width: 100%;
    height: auto;
    cursor: pointer;
    border-radius: 50%;
    transition: filter 0.3s;
  }
  #timerCanvas.pulse {
    animation: canvasPulse 0.5s ease-out;
  }
  @keyframes canvasPulse {
    0% { filter: brightness(1.5); }
    100% { filter: brightness(1); }
  }

  /* Overlaid digital display */
  .timer-center-text {
    position: absolute;
    text-align: center;
    pointer-events: none;
    user-select: none;
  }
  .timer-digital {
    font-family: var(--mono);
    font-size: clamp(28px, 6vw, 52px);
    font-weight: 500;
    color: var(--text);
    line-height: 1;
    letter-spacing: -1px;
  }
  .timer-label-text {
    font-size: 11px;
    color: var(--text);
    opacity: 0.4;
    margin-top: 4px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* Status bar */
  .status-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    color: var(--text);
    opacity: 0.6;
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--border);
    transition: background 0.3s;
  }
  .status-dot.running { background: var(--accent); animation: blink 1s ease-in-out infinite; }
  .status-dot.done { background: #4caf50; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* Progress bar (linear option) */
  .linear-bar-wrap {
    width: 100%;
    max-width: 480px;
  }
  .linear-bar {
    height: 6px;
    background: var(--timer-track);
    border-radius: 3px;
    overflow: hidden;
  }
  .linear-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 0.5s linear;
  }

  /* ── NOTIFICATION ── */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 20px;
    font-size: 14px;
    font-weight: 500;
    z-index: 100;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    white-space: nowrap;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ── MODAL (fullscreen) ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 200;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px;
    width: min(440px, 92vw);
    transform: scale(0.95);
    transition: transform 0.2s;
  }
  .modal-overlay.open .modal { transform: scale(1); }
  .modal h2 { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
  .modal-close {
    float: right; background: none; border: none; color: var(--text);
    font-size: 20px; cursor: pointer; opacity: 0.5; line-height: 1;
  }
  .modal-close:hover { opacity: 1; }

  /* Color picker */
  .color-row { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
  .color-row label { font-size: 13px; flex: 1; }
  .color-row input[type=color] {
    width: 38px; height: 28px; padding: 2px; border: 1px solid var(--border);
    border-radius: 6px; background: var(--surface2); cursor: pointer;
  }

  /* ── MOBILE ── */
  @media (max-width: 680px) {
    .app {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr auto;
    }
    header { padding: 14px 16px; }
    .sidebar {
      border-right: none;
      border-top: 1px solid var(--border);
      order: 3;
      padding: 16px;
      gap: 16px;
      overflow-y: visible;
    }
    .main { padding: 20px 16px; gap: 16px; }
    .preset-grid { grid-template-columns: repeat(3, 1fr); }
    #timerCanvas { max-width: min(340px, 85vw); }
    .timer-digital { font-size: clamp(24px, 9vw, 40px); }
    .section-label { margin-bottom: 8px; }
    /* Collapsible sidebar sections on mobile */
    .sidebar-section { }
    .section-header { cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .section-header .chevron { transition: transform 0.2s; }
    .section-header.collapsed .chevron { transform: rotate(-90deg); }
    .section-body { overflow: hidden; transition: max-height 0.3s ease; max-height: 400px; }
    .section-body.hidden { max-height: 0; }
  }

  /* ── FULLSCREEN MODE ── */
  body.fullscreen-mode .sidebar,
  body.fullscreen-mode header { display: none; }
  body.fullscreen-mode .app { grid-template-columns: 1fr; }
  body.fullscreen-mode .main { height: 100vh; }
  body.fullscreen-mode #timerCanvas { max-width: min(80vh, 80vw); max-height: min(80vh, 80vw); }

  .fullscreen-exit {
    display: none;
    position: fixed; top: 16px; right: 16px;
    z-index: 50;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-family: var(--font);
    font-size: 13px;
    color: var(--text);
  }
  body.fullscreen-mode .fullscreen-exit { display: block; }

  /* ── DRAG HANDLE on timer (desktop) ── */
  .drag-hint {
    font-size: 11px;
    opacity: 0.3;
    text-align: center;
    letter-spacing: 0.5px;
  }

  /* Range slider for volume */
  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
    margin-top: 6px;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* Countdown overlay when finishing */
  .finish-overlay {
    position: fixed; inset: 0;
    background: var(--accent-glow);
    pointer-events: none;
    z-index: 10;
    opacity: 0;
    transition: opacity 0.4s;
  }
  .finish-overlay.flash { animation: flashAnim 0.6s ease-out; }
  @keyframes flashAnim {
    0% { opacity: 0.8; }
    100% { opacity: 0; }
  }

</style>
</head>
<body>
<div class="finish-overlay" id="finishOverlay"></div>

<button class="fullscreen-exit" onclick="toggleFullscreen()">✕ 나가기</button>

<div class="app">
  <!-- HEADER -->
  <header>
    <div class="logo">
      <span class="logo-dot"></span>
      Time Timer
    </div>
    <div class="header-actions">
      <button class="btn-icon" onclick="openCustomModal()">🎨 커스텀</button>
      <button class="btn-icon" onclick="toggleFullscreen()">⛶ 전체화면</button>
    </div>
  </header>

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <!-- Time Input -->
    <div class="sidebar-section">
      <div class="section-header" onclick="toggleSection(this)">
        <div class="section-label">시간 설정</div>
        <span class="chevron">▾</span>
      </div>
      <div class="section-body">
        <div class="time-input-group">
          <div class="time-fields">
            <input type="number" id="inputH" min="0" max="23" value="0" placeholder="00">
            <span class="time-label">시간</span>
          </div>
          <span class="sep">:</span>
          <div class="time-fields">
            <input type="number" id="inputM" min="0" max="59" value="25" placeholder="00">
            <span class="time-label">분</span>
          </div>
          <span class="sep">:</span>
          <div class="time-fields">
            <input type="number" id="inputS" min="0" max="59" value="0" placeholder="00">
            <span class="time-label">초</span>
          </div>
        </div>
        <div style="margin-top:10px">
          <div class="section-label" style="margin-bottom:6px">빠른 설정</div>
          <div class="quick-btns">
            <button class="quick-btn" onclick="setQuick(0,1,0)">1분</button>
            <button class="quick-btn" onclick="setQuick(0,5,0)">5분</button>
            <button class="quick-btn" onclick="setQuick(0,10,0)">10분</button>
            <button class="quick-btn" onclick="setQuick(0,15,0)">15분</button>
            <button class="quick-btn" onclick="setQuick(0,25,0)">25분</button>
            <button class="quick-btn" onclick="setQuick(0,30,0)">30분</button>
            <button class="quick-btn" onclick="setQuick(0,45,0)">45분</button>
            <button class="quick-btn" onclick="setQuick(1,0,0)">1시간</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="sidebar-section">
      <div class="section-label">컨트롤</div>
      <div class="controls" style="margin-bottom:8px">
        <button class="btn btn-primary" id="btnStart" onclick="startTimer()">▶ 시작</button>
        <button class="btn" id="btnPause" onclick="pauseTimer()" disabled>⏸ 일시정지</button>
      </div>
      <div class="controls">
        <button class="btn" onclick="resetTimer()">↺ 리셋</button>
        <button class="btn" onclick="addLap()">⊕ 랩</button>
      </div>
    </div>

    <!-- Design Presets -->
    <div class="sidebar-section">
      <div class="section-header" onclick="toggleSection(this)">
        <div class="section-label">디자인 프리셋</div>
        <span class="chevron">▾</span>
      </div>
      <div class="section-body">
        <div class="preset-grid">
          <div class="preset-swatch active" style="background:linear-gradient(135deg,#0f0f12,#ff4c4c)" onclick="applyPreset('default',this)" title="다크 레드">
            <span>Default</span>
          </div>
          <div class="preset-swatch" style="background:linear-gradient(135deg,#fafaf8,#222)" onclick="applyPreset('minimal',this)" title="미니멀">
            <span style="color:#222">Minimal</span>
          </div>
          <div class="preset-swatch" style="background:linear-gradient(135deg,#081420,#00bfff)" onclick="applyPreset('ocean',this)" title="오션">
            <span>Ocean</span>
          </div>
          <div class="preset-swatch" style="background:linear-gradient(135deg,#0a1410,#4caf50)" onclick="applyPreset('forest',this)" title="포레스트">
            <span>Forest</span>
          </div>
          <div class="preset-swatch" style="background:linear-gradient(135deg,#1a0a00,#ff8c00)" onclick="applyPreset('sunset',this)" title="선셋">
            <span>Sunset</span>
          </div>
          <div class="preset-swatch" style="background:linear-gradient(135deg,#080a18,#a855f7)" onclick="applyPreset('aurora',this)" title="오로라">
            <span>Aurora</span>
          </div>
          <div class="preset-swatch" style="background:linear-gradient(135deg,#2c2c2c,#f5e642)" onclick="applyPreset('chalk',this)" title="칠판">
            <span>Chalk</span>
          </div>
          <div class="preset-swatch" id="customSwatch" style="background:conic-gradient(from 180deg,#ff6b6b,#ffd93d,#6bcb77,#4d96ff,#ff6b6b)" onclick="applyPreset('custom',this)" title="커스텀">
            <span>Custom</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Upload Image -->

<!-- CUSTOM COLOR MODAL -->
<div class="modal-overlay" id="customModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('customModal')">✕</button>
    <h2>🎨 커스텀 색상</h2>

    </div>

      <input type="color" id="cc-text" value="#e8e8f0" oninput="applyCustomColor()">
    </div>

  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// STATE
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
let totalSeconds = 25 * 60;
let remainingSeconds = totalSeconds;
let isRunning = false;
let intervalId = null;
let bgImage = null;
let currentPreset = 'default';
let laps = [];
let lapCount = 0;

const opts = {
  sound: true,
  digital: true,
  linear: false,
  elapsed: false,
  repeat: false,
  ticks: true,
  glow: true,
  volume: 0.7
};

// Custom colors (applied via CSS vars on body)
let customColors = {
  bg: '#0f0f12', surface: '#1a1a20', accent: '#ff4c4c', track: '#2a2a36', text: '#e8e8f0'
};

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// CANVAS DRAWING
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const canvas = document.getElementById('timerCanvas');
const ctx = canvas.getContext('2d');

function getVar(name) {
  return getComputedStyle(document.body).getPropertyValue(name).trim();
}

function drawTimer() {
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2;
  const R = W * 0.42;
  const lineW = W * 0.072;

  ctx.clearRect(0, 0, W, H);

  // Background with image or color
  if (bgImage) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, R + lineW/2 + 4, 0, Math.PI*2);
    ctx.closePath();
    ctx.clip();
    // Cover-fit
    const iAsp = bgImage.width / bgImage.height;
    const diam = (R + lineW/2 + 4) * 2;
    let sw, sh, sx, sy;
    if (iAsp > 1) { sh = diam; sw = sh * iAsp; }
    else { sw = diam; sh = sw / iAsp; }
    sx = cx - sw/2; sy = cy - sh/2;
    ctx.drawImage(bgImage, sx, sy, sw, sh);
    ctx.restore();
    // slight dark overlay for readability
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, R + lineW/2 + 4, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(0,0,0,0.38)';
    ctx.fill();
    ctx.restore();
  } else {
    // Timer face background
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, R + lineW/2 + 4, 0, Math.PI*2);
    ctx.fillStyle = getVar('--timer-bg');
    ctx.fill();
    ctx.restore();
  }

  const frac = totalSeconds > 0 ? remainingSeconds / totalSeconds : 0;
  const startAngle = -Math.PI/2;

  // Track ring
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI*2);
  ctx.strokeStyle = getVar('--timer-track');
  ctx.lineWidth = lineW;
  ctx.stroke();

  // Elapsed slice (filled segment behind)
  const elapsedFrac = 1 - frac;
  if (elapsedFrac > 0.002) {
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R + lineW/2, startAngle, startAngle + elapsedFrac * Math.PI*2);
    ctx.closePath();
    ctx.fillStyle = getVar('--elapsed-color');
    ctx.fill();
  }

  // Remaining arc
  if (frac > 0.002) {
    const endAngle = startAngle + frac * Math.PI*2;

    if (opts.glow) {
      ctx.save();
      ctx.shadowColor = getVar('--accent');
      ctx.shadowBlur = 18;
    }

    ctx.beginPath();
    ctx.arc(cx, cy, R, startAngle, endAngle);
    ctx.strokeStyle = getVar('--remaining-color');
    ctx.lineWidth = lineW;
    ctx.lineCap = 'round';
    ctx.stroke();

    if (opts.glow) ctx.restore();

    // Sweep tip dot
    const tipX = cx + R * Math.cos(endAngle);
    const tipY = cy + R * Math.sin(endAngle);
    ctx.beginPath();
    ctx.arc(tipX, tipY, lineW/2 + 2, 0, Math.PI*2);
    ctx.fillStyle = getVar('--remaining-color');
    if (opts.glow) {
      ctx.shadowColor = getVar('--accent');
      ctx.shadowBlur = 24;
    }
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // Tick marks
  if (opts.ticks) {
    for (let i = 0; i < 60; i++) {
      const a = (i / 60) * Math.PI*2 - Math.PI/2;
      const isMajor = i % 5 === 0;
      const outer = R + lineW/2 + (isMajor ? 10 : 5);
      const inner = R + lineW/2 + (isMajor ? 3 : 2);
      ctx.beginPath();
      ctx.moveTo(cx + outer*Math.cos(a), cy + outer*Math.sin(a));
      ctx.lineTo(cx + inner*Math.cos(a), cy + inner*Math.sin(a));
      ctx.strokeStyle = isMajor
        ? (getVar('--text') || '#e8e8f0')
        : getVar('--timer-track');
      ctx.lineWidth = isMajor ? 2.5 : 1.2;
      ctx.globalAlpha = isMajor ? 0.55 : 0.3;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    // Minute labels
    ctx.font = `${W*0.028}px DM Sans, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = getVar('--text');
    ctx.globalAlpha = 0.35;
    [5,10,15,20,25,30,35,40,45,50,55,60].forEach(min => {
      const a = (min/60)*Math.PI*2 - Math.PI/2;
      const lr = R + lineW/2 + 22;
      ctx.fillText(String(min), cx + lr*Math.cos(a), cy + lr*Math.sin(a));
    });
    ctx.globalAlpha = 1;
  }

  // Center circle (hole)
  ctx.beginPath();
  ctx.arc(cx, cy, R - lineW/2 - 2, 0, Math.PI*2);
  if (bgImage) {
    ctx.fillStyle = 'rgba(0,0,0,0)';
  } else {
    ctx.fillStyle = getVar('--timer-bg');
  }
  ctx.fill();

  // Outer border
  ctx.beginPath();
  ctx.arc(cx, cy, R + lineW/2 + 4, 0, Math.PI*2);
  ctx.strokeStyle = getVar('--border');
  ctx.lineWidth = 2;
  ctx.stroke();

  // Update digital display
  updateDisplayText();
}

function updateDisplayText() {
  const disp = opts.elapsed
    ? (totalSeconds - remainingSeconds)
    : remainingSeconds;

  const h = Math.floor(disp / 3600);
  const m = Math.floor((disp % 3600) / 60);
  const s = disp % 60;

  let str;
  if (h > 0) str = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  else str = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;

  document.getElementById('digitalDisplay').textContent = str;
  document.getElementById('digitalDisplay').style.display = opts.digital ? '' : 'none';

  // Linear bar
  const frac = totalSeconds > 0 ? remainingSeconds / totalSeconds : 0;
  document.getElementById('linearFill').style.width = (frac*100) + '%';
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// TIMER LOGIC
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function getInputSeconds() {
  const h = parseInt(document.getElementById('inputH').value) || 0;
  const m = parseInt(document.getElementById('inputM').value) || 0;
  const s = parseInt(document.getElementById('inputS').value) || 0;
  return h*3600 + m*60 + s;
}

function startTimer() {
  if (isRunning) return;
  if (remainingSeconds === 0 || remainingSeconds === totalSeconds) {
    totalSeconds = getInputSeconds();
    if (totalSeconds === 0) { showToast('시간을 설정해주세요'); return; }
    remainingSeconds = totalSeconds;
  }
  isRunning = true;
  document.getElementById('btnStart').disabled = true;
  document.getElementById('btnPause').disabled = false;
  document.getElementById('statusDot').className = 'status-dot running';
  document.getElementById('statusText').textContent = '실행 중...';
  document.getElementById('timerStatus').textContent = '실행 중';
  intervalId = setInterval(tick, 1000);
  drawTimer();
}

function tick() {
  if (remainingSeconds > 0) {
    remainingSeconds--;
    drawTimer();
    if (remainingSeconds === 0) finish();
  }
}

function pauseTimer() {
  if (!isRunning) return;
  isRunning = false;
  clearInterval(intervalId);
  intervalId = null;
  document.getElementById('btnStart').disabled = false;
  document.getElementById('btnPause').disabled = true;
  document.getElementById('statusDot').className = 'status-dot';
  document.getElementById('statusText').textContent = '일시정지됨';
  document.getElementById('timerStatus').textContent = '일시정지';
}

function resetTimer() {
  pauseTimer();
  totalSeconds = getInputSeconds() || 25*60;
  remainingSeconds = totalSeconds;
  document.getElementById('statusDot').className = 'status-dot';
  document.getElementById('statusText').textContent = '시작 버튼을 누르거나 타이머를 클릭하세요';
  document.getElementById('timerStatus').textContent = '준비';
  drawTimer();
}

function finish() {
  isRunning = false;
  clearInterval(intervalId);
  intervalId = null;
  document.getElementById('btnStart').disabled = false;
  document.getElementById('btnPause').disabled = true;
  document.getElementById('statusDot').className = 'status-dot done';
  document.getElementById('statusText').textContent = '타이머 완료! 🎉';
  document.getElementById('timerStatus').textContent = '완료!';
  // Flash
  const ov = document.getElementById('finishOverlay');
  ov.classList.add('flash');
  setTimeout(() => ov.classList.remove('flash'), 700);
  canvas.classList.add('pulse');
  setTimeout(() => canvas.classList.remove('pulse'), 600);
  // Sound
  if (opts.sound) playAlarm();
  showToast('⏰ 타이머 완료!');
  // Repeat
  if (opts.repeat) {
    setTimeout(() => {
      remainingSeconds = totalSeconds;
      startTimer();
    }, 1500);
  }
}

function handleCanvasClick() {
  if (isRunning) pauseTimer();
  else startTimer();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// QUICK SET
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function setQuick(h, m, s) {
  document.getElementById('inputH').value = h;
  document.getElementById('inputM').value = m;
  document.getElementById('inputS').value = s;
  pauseTimer();
  totalSeconds = h*3600 + m*60 + s;
  remainingSeconds = totalSeconds;
  drawTimer();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// LAPS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function addLap() {
  if (!isRunning && remainingSeconds === totalSeconds) return;
  lapCount++;
  const elapsed = totalSeconds - remainingSeconds;
  const h = Math.floor(elapsed/3600), m = Math.floor((elapsed%3600)/60), s = elapsed%60;
  const timeStr = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  laps.push({ n: lapCount, time: timeStr });
  renderLaps();
  document.getElementById('lapSection').style.display = 'block';
  showToast(`랩 ${lapCount}: ${timeStr}`);
}

function renderLaps() {
  const list = document.getElementById('lapList');
  list.innerHTML = laps.slice().reverse().map(l =>
    `<div class="lap-item"><span>랩 ${l.n}</span><span>${l.time}</span></div>`
  ).join('');
}

function clearLaps() {
  laps = []; lapCount = 0;
  document.getElementById('lapSection').style.display = 'none';
  document.getElementById('lapList').innerHTML = '';
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// PRESETS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function applyPreset(name, el) {
  currentPreset = name;
  // Remove all preset classes
  document.body.className = document.body.className
    .split(' ').filter(c => !c.startsWith('preset-')).join(' ');
  if (name !== 'default') {
    document.body.classList.add('preset-' + name);
  }
  // Update active swatch
  document.querySelectorAll('.preset-swatch').forEach(s => s.classList.remove('active'));
  if (el) el.classList.add('active');
  // Clear custom style if not custom
  if (name !== 'custom') {
    document.getElementById('customStyle')?.remove();
  }
  drawTimer();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// CUSTOM COLORS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function openCustomModal() {
  document.getElementById('customModal').classList.add('open');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

function applyCustomColor() {
  customColors.bg = document.getElementById('cc-bg').value;
  customColors.surface = document.getElementById('cc-surface').value;
  customColors.accent = document.getElementById('cc-accent').value;
  customColors.track = document.getElementById('cc-track').value;
  customColors.text = document.getElementById('cc-text').value;
}

function saveCustom() {
  let styleEl = document.getElementById('customStyle');
  if (!styleEl) {
    styleEl = document.createElement('style');
    styleEl.id = 'customStyle';
    document.head.appendChild(styleEl);
  }
  const c = customColors;
  // Darken surface2 slightly
  styleEl.textContent = `
    body.preset-custom {
      --bg: ${c.bg};
      --surface: ${c.surface};
      --surface2: ${adjustColor(c.surface, -10)};
      --border: ${adjustColor(c.surface, 20)};
      --text: ${c.text};
      --accent: ${c.accent};
      --accent-glow: ${hexToRgba(c.accent, 0.2)};
      --timer-bg: ${c.surface};
      --timer-ring: ${c.accent};
      --timer-track: ${adjustColor(c.surface, 15)};
      --elapsed-color: ${hexToRgba(c.accent, 0.12)};
      --remaining-color: ${c.accent};
    }
  `;
  applyPreset('custom', document.getElementById('customSwatch'));
  closeModal('customModal');
  showToast('커스텀 색상이 적용되었습니다');
}

function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function adjustColor(hex, amount) {
  let r = parseInt(hex.slice(1,3),16);
  let g = parseInt(hex.slice(3,5),16);
  let b = parseInt(hex.slice(5,7),16);
  r = Math.min(255,Math.max(0, r+amount));
  g = Math.min(255,Math.max(0, g+amount));
  b = Math.min(255,Math.max(0, b+amount));
  return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// IMAGE UPLOAD
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const uploadArea = document.getElementById('uploadArea');
uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.style.borderColor = 'var(--accent)'; });
uploadArea.addEventListener('dragleave', () => { uploadArea.style.borderColor = ''; });
uploadArea.addEventListener('drop', e => {
  e.preventDefault();
  uploadArea.style.borderColor = '';
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) loadBgImage(file);
});

function handleImageUpload(e) {
  const file = e.target.files[0];
  if (file) loadBgImage(file);
}

function loadBgImage(file) {
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      bgImage = img;
      drawTimer();
      showToast('배경 이미지가 적용되었습니다');
      document.getElementById('uploadArea').style.background = `url(${ev.target.result}) center/cover`;
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function clearBgImage() {
  bgImage = null;
  document.getElementById('bgUpload').value = '';
  document.getElementById('uploadArea').style.background = '';
  drawTimer();
  showToast('배경 이미지가 제거되었습니다');
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// TOGGLES
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function toggleOpt(key) {
  opts[key] = !opts[key];
  const el = document.getElementById('toggle' + key.charAt(0).toUpperCase() + key.slice(1));
  if (el) el.classList.toggle('on', opts[key]);

  if (key === 'linear') {
    document.getElementById('linearBarWrap').style.display = opts.linear ? '' : 'none';
  }
  drawTimer();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// SOUND
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function playAlarm() {
  try {
    const ctx2 = new (window.AudioContext || window.webkitAudioContext)();
    const vol = ctx2.createGain();
    vol.gain.value = opts.volume;
    vol.connect(ctx2.destination);

    const notes = [523, 659, 784, 1047]; // C E G C
    notes.forEach((freq, i) => {
      const osc = ctx2.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const g = ctx2.createGain();
      g.gain.setValueAtTime(0, ctx2.currentTime + i*0.18);
      g.gain.linearRampToValueAtTime(0.35, ctx2.currentTime + i*0.18 + 0.05);
      g.gain.exponentialRampToValueAtTime(0.001, ctx2.currentTime + i*0.18 + 0.5);
      osc.connect(g);
      g.connect(vol);
      osc.start(ctx2.currentTime + i*0.18);
      osc.stop(ctx2.currentTime + i*0.18 + 0.5);
    });
  } catch(e) {}
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// TOAST
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// FULLSCREEN
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function toggleFullscreen() {
  document.body.classList.toggle('fullscreen-mode');
  drawTimer();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// MOBILE COLLAPSIBLE
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function toggleSection(headerEl) {
  if (window.innerWidth > 680) return;
  headerEl.classList.toggle('collapsed');
  const body = headerEl.nextElementSibling;
  if (body && body.classList.contains('section-body')) {
    body.classList.toggle('hidden');
  }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// KEYBOARD SHORTCUTS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  switch(e.code) {
    case 'Space': e.preventDefault(); isRunning ? pauseTimer() : startTimer(); break;
    case 'KeyR': resetTimer(); break;
    case 'KeyL': addLap(); break;
    case 'KeyF': toggleFullscreen(); break;
    case 'KeyM': toggleOpt('sound'); break;
  }
});

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// CANVAS RESIZE
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function resizeCanvas() {
  // Canvas intrinsic size stays 500x500 for quality
  // CSS handles display sizing
  drawTimer();
}

window.addEventListener('resize', () => {
  drawTimer();
});

// Input changes
['inputH','inputM','inputS'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => {
    if (!isRunning) {
      totalSeconds = getInputSeconds();
      remainingSeconds = totalSeconds;
      drawTimer();
    }
  });
});

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// INIT
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Small delay to let CSS vars resolve
setTimeout(() => {
  drawTimer();
  // Show keyboard hint on desktop
  if (window.innerWidth > 680) {
    document.getElementById('dragHint').textContent = '스페이스: 시작/정지 · R: 리셋 · L: 랩 · F: 전체화면 · M: 음소거';
  }
}, 100);

// Redraw every frame while running for smooth glow
function animLoop() {
  if (isRunning) drawTimer();
  requestAnimationFrame(animLoop);
}
animLoop();

// Close modal on overlay click
document.getElementById('customModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal('customModal');
});
</script>
</body>
